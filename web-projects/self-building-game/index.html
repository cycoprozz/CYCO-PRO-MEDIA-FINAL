<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID HUNTER — The Game That Builds Itself</title>
<style>
  :root { --bg:#010108; --surface:#08081a; --border:#1a1a38; --text:#c0c8d8; --cyan:#00e5ff; --purple:#b850ff; --green:#00ff88; --red:#ff3355; --gold:#ffb800; --orange:#ff6622; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Courier New',monospace; overflow:hidden; height:100vh; display:flex; user-select:none; cursor:none; }
  #game-wrapper { display:flex; flex:1; height:100vh; padding:8px; gap:0; }
  #canvas-area { flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
  canvas { border:1px solid var(--border); border-radius:4px; transition:width 0.8s ease,height 0.8s ease; box-shadow:0 0 80px rgba(0,229,255,0.04),inset 0 0 80px rgba(0,0,0,0.3); }
  #build-log { width:290px; background:var(--surface); border:1px solid var(--border); border-radius:4px; display:flex; flex-direction:column; overflow:hidden; }
  #build-log h2 { padding:10px 12px; font-size:11px; letter-spacing:2px; color:var(--cyan); border-bottom:1px solid var(--border); background:rgba(0,229,255,0.02); text-transform:uppercase; }
  #log-entries { flex:1; overflow-y:auto; padding:5px; font-size:10px; line-height:1.6; }
  .log-entry { padding:4px 6px; margin-bottom:2px; border-left:2px solid var(--border); animation:slideIn 0.4s ease-out; color:#444; }
  .log-entry.unlocked { border-left-color:var(--cyan); color:var(--text); background:rgba(0,229,255,0.02); }
  .log-entry .kill-tag { display:inline-block; background:var(--purple); color:#fff; padding:1px 4px; border-radius:2px; font-size:8px; margin-right:4px; font-weight:bold; }
  .log-entry .system-name { color:var(--cyan); font-weight:bold; }
  .log-entry .system-desc { color:#666; margin-left:2px; }
  @keyframes slideIn { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:translateX(0); } }
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:rgba(8,8,26,0.95); border:1px solid var(--cyan); border-radius:5px; padding:12px 22px; pointer-events:none; opacity:0; transition:opacity 0.3s,transform 0.4s; z-index:100; text-align:center; box-shadow:0 0 40px rgba(0,229,255,0.12); backdrop-filter:blur(8px); }
  #toast.show { opacity:1; }
  #toast .toast-icon { font-size:22px; margin-bottom:2px; }
  #toast .toast-title { color:var(--cyan); font-size:12px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; }
  #toast .toast-desc { color:#666; font-size:9px; margin-top:2px; }
  #death-overlay { position:fixed; inset:0; background:rgba(1,1,8,0.92); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:200; backdrop-filter:blur(4px); }
  #death-overlay.visible { display:flex; }
  #death-overlay h1 { font-size:28px; color:var(--red); margin-bottom:8px; letter-spacing:4px; text-shadow:0 0 30px rgba(255,51,85,0.5); }
  #death-overlay .stats { color:#777; font-size:11px; margin-bottom:20px; text-align:center; line-height:1.8; }
  #death-overlay button { background:var(--cyan); color:#000; border:none; padding:10px 26px; font-family:'Courier New',monospace; font-size:12px; font-weight:bold; letter-spacing:2px; cursor:pointer; border-radius:3px; text-transform:uppercase; transition:box-shadow 0.2s; }
  #death-overlay button:hover { box-shadow:0 0 25px rgba(0,229,255,0.5); }
  .val { color:var(--cyan); font-weight:bold; }

  #controls-overlay {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; gap:14px; padding:8px 18px;
    background:rgba(8,8,26,0.85); border:1px solid var(--border);
    border-radius:6px; z-index:50; pointer-events:none;
    backdrop-filter:blur(4px);
  }
  .ctrl-row { display:flex; align-items:center; gap:6px; font-size:9px; color:#667; }
  .ctrl-row kbd {
    background:rgba(0,229,255,0.1); color:var(--cyan);
    padding:2px 5px; border-radius:3px; font-family:'Courier New',monospace;
    font-size:8px; border:1px solid rgba(0,229,255,0.2); letter-spacing:0.5px;
  }
  .ctrl-row span { color:#555; }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="canvas-area"><canvas id="game"></canvas></div>
  <div id="build-log">
    <h2>[ SHIP SYSTEMS ]</h2>
    <div id="log-entries"></div>
  </div>
</div>

<div id="toast"></div>
<div id="death-overlay">
  <h1>SHIP DESTROYED</h1>
  <div class="stats" id="death-stats"></div>
  <button onclick="restartGame()">REBOOT</button>
</div>

<div id="controls-overlay">
  <div class="ctrl-row"><kbd>W A S D</kbd> <span>Move ship</span></div>
  <div class="ctrl-row"><kbd>Q / E</kbd> <span>Rotate</span></div>
  <div class="ctrl-row"><kbd>MOUSE</kbd> <span>Aim crosshair</span></div>
  <div class="ctrl-row"><kbd>CLICK</kbd> <span>Fire blaster</span></div>
  <div class="ctrl-row"><kbd>RMB / E</kbd> <span>Missile</span></div>
  <div class="ctrl-row"><kbd>SHIFT</kbd> <span>Boost</span></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  VOID HUNTER — destroy ships, unlock systems, the game builds itself
// ═══════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ─── PROGRESSION ────────────────────────────────────────────
const UNLOCKS = [
  { at:0,   name:'Basic Flight',     desc:'Thrust and rotation. Basic blaster online.', icon:'🚀' },
  { at:5,   name:'Targeting Reticle',desc:'Auto-aim crosshair. Kill counter active.',   icon:'🎯', systems:['reticle','killHud'] },
  { at:12,  name:'Shield Generator', desc:'Energy shield absorbs impact. Shield HUD.',  icon:'🛡️', systems:['shield','shieldHud'] },
  { at:22,  name:'Missile Battery',  desc:'Dual launchers. Right-click or E to fire.',  icon:'🚀', systems:['missiles','missileHud'] },
  { at:35,  name:'Afterburner',      desc:'SHIFT for extreme boost. Engine trail.',     icon:'💨', systems:['boost','boostHud'] },
  { at:50,  name:'Squadron Alert',   desc:'Enemy fighters now hunt in trios.',           icon:'⚠️', systems:['squadrons'] },
  { at:70,  name:'Plasma Overcharge',desc:'Hold fire to charge a plasma projectile.',    icon:'💥', systems:['plasma','chargeHud'] },
  { at:90,  name:'Capital Ships',    desc:'Boss-class destroyers enter the void.',       icon:'🦾', systems:['bosses'] },
  { at:120, name:'Phase Drive',      desc:'Double-tap A or D for short-range teleport.',icon:'🌀', systems:['teleport','phaseHud'] },
  { at:160, name:'Autocannon Sentry',desc:'Orbital drone fires alongside your ship.',    icon:'🤖', systems:['drone'] },
  { at:200, name:'Singularity',      desc:'All systems maxed. You are the void.',        icon:'∞', systems:['infinite'] },
];

// ─── SAVE ───────────────────────────────────────────────────
function loadSave() { try { const r=localStorage.getItem('vh_save'); if(r) return JSON.parse(r); } catch(e){} return null; }
function saveGame() { localStorage.setItem('vh_save', JSON.stringify({ kills:g.kills, bestKills:g.bestKills, arenaSize:g.arenaSize, upgrades:g.upgrades, unlockedSystems:[...g.unlockedSystems] })); }
function clearSave() { localStorage.removeItem('vh_save'); }

// ─── GAME STATE ─────────────────────────────────────────────
let g = {
  kills:0, bestKills:0, arenaSize:700, targetArena:700,
  unlockedSystems: new Set(),
  upgrades: { thrust:0.14, turnSpeed:0.06, fireRate:13, bulletSpeed:10, bulletDmg:1, shieldMax:0, shieldRegen:0.01, missileDmg:3, missileSpeed:5.5, boostForce:6, plasmaDmg:8 },
  ship: { x:0,y:0, vx:0,vy:0, angle:-Math.PI/2, hp:5,maxHp:5, shield:0, invuln:180, thrusting:false, boosting:false, boostFuel:100, boostCooldown:0, teleportCooldown:0 },
  enemies:[], bullets:[], missiles:[], particles:[], debris:[], powerups:[],
  keys:{}, mouse:{ x:0,y:0, down:false, right:false },
  fireCd:0, missileCd:0, plasmaCharge:0, plasmaCharging:false,
  shakeAmt:0, shakeX:0, shakeY:0, score:0,
  spawnTimer:120, maxEnemies:2,
  stars:[], planets:[], nebulae:[], asteroids:[], dust:[],
  time:0,
};

// ─── BACKGROUND GENERATION ──────────────────────────────────
function genWorld() {
  const s = g.arenaSize;
  // Multi-layer stars
  g.stars = [];
  for (let l=0; l<3; l++) {
    const count = [60, 100, 160][l];
    const speed = [0.02, 0.05, 0.12][l];
    const brightness = [0.3, 0.5, 0.8][l];
    for (let i=0; i<count; i++) {
      g.stars.push({ x:Math.random()*s, y:Math.random()*s, r:0.4+Math.random()*1.4, layer:l, speed, brightness, twinkle:Math.random()*Math.PI*2, twinkleSpeed:0.01+Math.random()*0.04 });
    }
  }
  // Nebulae — large soft glowing clouds
  g.nebulae = [];
  const nebColors = [
    { c1:'rgba(30,10,60,0.06)', c2:'rgba(80,20,120,0.03)', r:180 },
    { c1:'rgba(10,30,50,0.05)', c2:'rgba(20,60,100,0.02)', r:140 },
    { c1:'rgba(40,15,30,0.04)', c2:'rgba(100,30,60,0.02)', r:160 },
    { c1:'rgba(10,40,40,0.04)', c2:'rgba(20,80,70,0.02)', r:150 },
  ];
  for (const nc of nebColors) {
    g.nebulae.push({ x:Math.random()*s, y:Math.random()*s, r:nc.r, c1:nc.c1, c2:nc.c2, driftX:(Math.random()-0.5)*0.06, driftY:(Math.random()-0.5)*0.06 });
  }
  // Planets
  g.planets = [];
  const planetDefs = [
    { r:55, x:s*0.12, y:s*0.18, color:'#1a3a5c', atm:'rgba(30,80,160,0.15)', ring:false, driftX:0.02, driftY:0.01 },
    { r:38, x:s*0.85, y:s*0.78, color:'#5c2a1a', atm:'rgba(180,70,30,0.12)', ring:true, ringColor:'rgba(200,150,100,0.25)', driftX:-0.015, driftY:-0.01 },
    { r:70, x:s*0.08, y:s*0.82, color:'#2a4a3a', atm:'rgba(40,140,80,0.10)', ring:false, driftX:0.01, driftY:-0.015 },
    { r:25, x:s*0.78, y:s*0.15, color:'#4a3a5c', atm:'rgba(120,80,180,0.15)', ring:false, driftX:-0.02, driftY:0.02 },
  ];
  for (const pd of planetDefs) {
    g.planets.push({...pd, craters:[], rotation:Math.random()*Math.PI*2});
    // Generate surface detail
    const p = g.planets[g.planets.length-1];
    p.craters = [];
    for (let i=0; i<8; i++) {
      p.craters.push({ angle:Math.random()*Math.PI*2, dist:0.2+Math.random()*0.7, r:3+Math.random()*8 });
    }
  }
  // Asteroid field
  g.asteroids = [];
  for (let i=0; i<40; i++) {
    g.asteroids.push({ x:Math.random()*s, y:Math.random()*s, r:2+Math.random()*8, vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3, rot:Math.random()*Math.PI*2, rotSpeed:(Math.random()-0.5)*0.02, verts:genAsteroidVerts(2+Math.random()*8) });
  }
  // Space dust
  g.dust = [];
  for (let i=0; i<80; i++) {
    g.dust.push({ x:Math.random()*s, y:Math.random()*s, r:0.3+Math.random()*0.6, alpha:0.1+Math.random()*0.3 });
  }
}

function genAsteroidVerts(r) {
  const verts = []; const n=6+Math.floor(Math.random()*5);
  for (let i=0; i<n; i++) {
    const a=(Math.PI*2/n)*i;
    const rr=r*(0.6+Math.random()*0.4);
    verts.push({ x:Math.cos(a)*rr, y:Math.sin(a)*rr });
  }
  return verts;
}

// ─── INIT ───────────────────────────────────────────────────
function init(saved) {
  if (saved) {
    g.kills=saved.kills; g.bestKills=saved.bestKills||0;
    g.arenaSize=saved.arenaSize; g.targetArena=saved.arenaSize;
    g.upgrades={...g.upgrades,...saved.upgrades};
    g.unlockedSystems=new Set(saved.unlockedSystems);
  } else {
    g.kills=0; g.bestKills=0; g.arenaSize=700; g.targetArena=700;
 g.upgrades={ thrust:0.14, turnSpeed:0.06, fireRate:13, bulletSpeed:10, bulletDmg:1, shieldMax:0, shieldRegen:0.01, missileDmg:3, missileSpeed:5.5, boostForce:6, plasmaDmg:8 };
    g.unlockedSystems=new Set();
  }
  const s=g.arenaSize;
  g.ship={ x:s/2,y:s/2, vx:0,vy:0, angle:-Math.PI/2, hp:5,maxHp:5, shield:0, invuln:180, thrusting:false, boosting:false, boostFuel:100, boostCooldown:0, teleportCooldown:0 };
  g.enemies=[]; g.bullets=[]; g.missiles=[]; g.particles=[]; g.debris=[]; g.powerups=[];
  g.fireCd=0; g.missileCd=0; g.plasmaCharge=0; g.plasmaCharging=false;
  g.shakeAmt=0; g.shakeX=0; g.shakeY=0; g.score=0;
  g.spawnTimer=120; g.maxEnemies=2; g.time=0;

  applyUnlocksUpTo(g.kills);
  updateCanvas(); genWorld();
  rebuildLog(); saveGame();
}

function updateCanvas() {
  canvas.style.width=g.arenaSize+'px'; canvas.style.height=g.arenaSize+'px';
  canvas.width=g.arenaSize; canvas.height=g.arenaSize;
}

// ─── UNLOCKS ────────────────────────────────────────────────
function applyUnlocksUpTo(kills) {
  for (const u of UNLOCKS) {
    if (kills>=u.at && u.systems) {
      for (const sys of u.systems) { g.unlockedSystems.add(sys); }
    }
  }
  g.targetArena=700+[...g.unlockedSystems].length*42;
}

function checkUnlocks() {
  let added=false;
  for (const u of UNLOCKS) {
    if (g.kills>=u.at && u.systems) {
      for (const sys of u.systems) {
        if (!g.unlockedSystems.has(sys)) { g.unlockedSystems.add(sys); added=true; }
      }
      if (added) {
        addLogEntry(u); showToast(u);
        if (u.systems.includes('shield')) { g.ship.shield=100; g.upgrades.shieldMax=100; }
        if (u.systems.includes('boost')) g.ship.boostFuel=100;
      }
    }
  }
  if (added) {
    g.targetArena=700+[...g.unlockedSystems].length*42;
    genWorld(); saveGame();
  }
}

function addLogEntry(u) {
  const c=document.getElementById('log-entries');
  const d=document.createElement('div'); d.className='log-entry unlocked';
  d.innerHTML=`<span class="kill-tag">${u.at} KILLS</span><span class="system-name">${u.name}</span><span class="system-desc">${u.desc}</span>`;
  c.prepend(d); c.scrollTop=0;
}
function rebuildLog() {
  const c=document.getElementById('log-entries'); c.innerHTML='';
  const seen=new Set();
  for (const u of UNLOCKS) {
    const unlocked=u.systems?u.systems.every(s=>g.unlockedSystems.has(s)):(g.kills>=u.at&&u.at===0);
    if (unlocked&&!seen.has(u.name)) {
      const d=document.createElement('div'); d.className='log-entry unlocked';
      d.innerHTML=`<span class="kill-tag">${u.at} KILLS</span><span class="system-name">${u.name}</span><span class="system-desc">${u.desc}</span>`;
      c.appendChild(d); seen.add(u.name);
    }
  }
  for (const u of UNLOCKS) {
    if (u.at>g.kills&&u.systems&&!u.systems.every(s=>g.unlockedSystems.has(s))) {
      const d=document.createElement('div'); d.className='log-entry';
      d.innerHTML=`<span class="kill-tag">${u.at} KILLS</span><span class="system-name">${u.name}</span><span class="system-desc">[LOCKED] ${u.desc}</span>`;
      c.appendChild(d); break;
    }
  }
}
function showToast(u) {
  const el=document.getElementById('toast');
  el.innerHTML=`<div class="toast-icon">${u.icon}</div><div class="toast-title">${u.name} ONLINE</div><div class="toast-desc">${u.desc}</div>`;
  el.className='show'; setTimeout(()=>{el.className='';},2600);
}

// ─── INPUT ──────────────────────────────────────────────────
document.addEventListener('keydown',e=>{ g.keys[e.key.toLowerCase()]=true; if(e.key===' ')e.preventDefault(); });
document.addEventListener('keyup',e=>{ g.keys[e.key.toLowerCase()]=false; });
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect(); const sc=g.arenaSize/r.width;
  g.mouse.x=(e.clientX-r.left)*sc; g.mouse.y=(e.clientY-r.top)*sc;
});
canvas.addEventListener('mousedown',e=>{ if(e.button===0)g.mouse.down=true; if(e.button===2)g.mouse.right=true; });
canvas.addEventListener('mouseup',e=>{ if(e.button===0)g.mouse.down=false; if(e.button===2)g.mouse.right=false; });
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// ─── UPDATE ─────────────────────────────────────────────────
let lastTapTime=0, lastTapMx=0, lastTapMy=0;
function update() {
  const s=g.arenaSize; g.time++;

  // Arena resize
  if (Math.abs(g.arenaSize-g.targetArena)>1) {
    g.arenaSize+=(g.targetArena-g.arenaSize)*0.035;
    if (Math.abs(g.arenaSize-g.targetArena)<1.5) g.arenaSize=g.targetArena;
    updateCanvas(); genWorld();
  }

  // Shake
  if (g.shakeAmt>0.01) { g.shakeAmt*=0.86; g.shakeX=(Math.random()-0.5)*g.shakeAmt*2; g.shakeY=(Math.random()-0.5)*g.shakeAmt*2; }
  else { g.shakeAmt=0; g.shakeX=0; g.shakeY=0; }

  // ── MOVEMENT (WASD) ──
  let mx=0, my=0;
  if (g.keys['w']) my-=1;
  if (g.keys['s']) my+=1;
  if (g.keys['a']) mx-=1;
  if (g.keys['d']) mx+=1;

  // Normalize diagonal
  const mag=Math.sqrt(mx*mx+my*my);
  if (mag>1) { mx/=mag; my/=mag; }
  const moving = mag>0.1;

  g.ship.thrusting = moving;
  g.ship.boosting = false;

  // ── ROTATION (Q/E or arrow keys) ──
  if (g.keys['q']||g.keys['arrowleft']) g.ship.angle -= g.upgrades.turnSpeed;
  if (g.keys['e']||g.keys['arrowright']) g.ship.angle += g.upgrades.turnSpeed;

  // Apply movement force (WASD = strafe, ship faces independently)
  const moveSpeed = moving ? (g.ship.boosting?g.upgrades.boostForce:g.upgrades.thrust) : 0;
  g.ship.vx += mx * moveSpeed;
  g.ship.vy += my * moveSpeed;

  // Boost
  if (g.unlockedSystems.has('boost')&&(g.keys['shift']||g.keys['shiftleft']||g.keys['shiftright'])&&g.ship.boostFuel>0&&moving) {
    g.ship.boosting=true; g.ship.boostFuel=Math.max(0,g.ship.boostFuel-0.55);
    g.ship.vx+=mx*g.upgrades.boostForce*0.3;
    g.ship.vy+=my*g.upgrades.boostForce*0.3;
    const ex=g.ship.x-mx*16, ey=g.ship.y-my*16;
    spawnParticles(ex,ey,'#00e5ff',2,true);
    spawnParticles(ex,ey,'#ffffff',1,true);
  } else if (g.ship.boostFuel<100&&!g.ship.boosting) {
    g.ship.boostFuel=Math.min(100,g.ship.boostFuel+0.12);
  }

  // Engine trail
  if (moving) {
    if (Math.random()<0.7) {
      const ex=g.ship.x-mx*14, ey=g.ship.y-my*14;
      spawnParticles(ex,ey,g.ship.boosting?'#88ddff':'#3366aa',1,true);
    }
  }

  // Drag
  g.ship.vx*=0.992; g.ship.vy*=0.992;

  // Move + CLAMP to screen bounds
  g.ship.x+=g.ship.vx; g.ship.y+=g.ship.vy;
  const margin=18;
  if (g.ship.x<margin) { g.ship.x=margin; g.ship.vx=0; }
  if (g.ship.x>s-margin) { g.ship.x=s-margin; g.ship.vx=0; }
  if (g.ship.y<margin) { g.ship.y=margin; g.ship.vy=0; }
  if (g.ship.y>s-margin) { g.ship.y=s-margin; g.ship.vy=0; }

  // Teleport: double-tap any movement key
  if (g.unlockedSystems.has('teleport')&&g.ship.teleportCooldown<=0) {
    if (moving&&mx===lastTapMx&&my===lastTapMy&&Date.now()-lastTapTime<260) {
      g.ship.x+=mx*150; g.ship.y+=my*150;
      g.ship.teleportCooldown=170; spawnParticles(g.ship.x,g.ship.y,'#b850ff',18,false);
      spawnParticles(g.ship.x,g.ship.y,'#ffffff',6,false);
    }
    if (moving) { lastTapMx=mx; lastTapMy=my; lastTapTime=Date.now(); }
  }
  if (g.ship.teleportCooldown>0) g.ship.teleportCooldown--;

  // Shield
  if (g.unlockedSystems.has('shield')&&g.ship.shield<g.upgrades.shieldMax) {
    g.ship.shield=Math.min(g.upgrades.shieldMax,g.ship.shield+g.upgrades.shieldRegen);
  }
  if (g.ship.invuln>0) g.ship.invuln--;

  // ── WEAPONS ──
  if (g.fireCd>0) g.fireCd--;
  if (g.missileCd>0) g.missileCd--;
  const shooting=g.mouse.down||g.keys[' '];

  // Plasma charge
  if (g.unlockedSystems.has('plasma')&&shooting) {
    g.plasmaCharge=Math.min(100,g.plasmaCharge+0.7);
    g.plasmaCharging=true;
    // Charge particles
    if (Math.random()<0.3) spawnParticles(g.ship.x+Math.cos(g.ship.angle)*18,g.ship.y+Math.sin(g.ship.angle)*18,'#ff6600',1,false);
  } else if (g.plasmaCharging) {
    if (g.plasmaCharge>12) firePlasma();
    g.plasmaCharge=0; g.plasmaCharging=false;
  }

  // Normal fire
  if (!g.plasmaCharging&&shooting&&g.fireCd<=0) {
    fireBullet(); g.fireCd=g.upgrades.fireRate;
  }

  // Missiles
  if (g.unlockedSystems.has('missiles')&&(g.mouse.right||g.keys['e'])&&g.missileCd<=0) {
    fireMissile(); g.missileCd=38;
  }

  // ── BULLETS ──
  for (let i=g.bullets.length-1;i>=0;i--) {
    const b=g.bullets[i]; b.x+=b.vx; b.y+=b.vy; b.life--;
    if (b.life<=0||b.x<-40||b.x>s+40||b.y<-40||b.y>s+40) { g.bullets.splice(i,1); continue; }
    for (let j=g.enemies.length-1;j>=0;j--) {
      const e=g.enemies[j];
      if (dist(b.x,b.y,e.x,e.y)<e.size+5) {
        e.hp-=b.dmg; g.bullets.splice(i,1);
        spawnParticles(b.x,b.y,'#ffffff',3,false);
        if (e.hp<=0) killEnemy(e,j);
        break;
      }
    }
  }

  // ── MISSILES ──
  for (let i=g.missiles.length-1;i>=0;i--) {
    const m=g.missiles[i]; m.life--;
    if (m.life<=0||m.x<-40||m.x>s+40||m.y<-40||m.y>s+40) { g.missiles.splice(i,1); continue; }
    if (g.enemies.length>0&&m.targetIdx<g.enemies.length) {
      const e=g.enemies[m.targetIdx];
      const ang=Math.atan2(e.y-m.y,e.x-m.x);
      m.vx+=(Math.cos(ang)*m.speed-m.vx)*0.07;
      m.vy+=(Math.sin(ang)*m.speed-m.vy)*0.07;
    }
    m.x+=m.vx; m.y+=m.vy;
    if (Math.random()<0.7) spawnParticles(m.x,m.y,'#ff8800',1,true);
    for (let j=g.enemies.length-1;j>=0;j--) {
      const e=g.enemies[j];
      if (dist(m.x,m.y,e.x,e.y)<e.size+10) {
        e.hp-=m.dmg; g.missiles.splice(i,1);
        spawnParticles(m.x,m.y,'#ff6622',14,false);
        g.shakeAmt=Math.max(g.shakeAmt,9);
        if (e.hp<=0) killEnemy(e,j);
        break;
      }
    }
  }

  // ── DRONE ──
  if (g.unlockedSystems.has('drone')&&g.enemies.length>0&&g.fireCd<=g.upgrades.fireRate-4) {
    const nearest=g.enemies.reduce((a,b)=>dist(g.ship.x,g.ship.y,a.x,a.y)<dist(g.ship.x,g.ship.y,b.x,b.y)?a:b);
    const ang=Math.atan2(nearest.y-g.ship.y,nearest.x-g.ship.x);
    g.bullets.push({ x:g.ship.x+Math.cos(g.ship.angle+1.3)*22, y:g.ship.y+Math.sin(g.ship.angle+1.3)*22, vx:Math.cos(ang)*g.upgrades.bulletSpeed, vy:Math.sin(ang)*g.upgrades.bulletSpeed, dmg:g.upgrades.bulletDmg*0.55, life:80, color:'#b850ff' });
  }

  // ── SPAWN ──
  g.spawnTimer--;
  const maxE=g.unlockedSystems.has('squadrons')?g.maxEnemies+2:g.maxEnemies;
  if (g.spawnTimer<=0&&g.enemies.length<maxE) { spawnEnemy(); g.spawnTimer=Math.max(18,70-g.kills*0.18); g.maxEnemies=Math.min(15,2+Math.floor(g.kills/10)); }

  // ── ENEMIES ──
  for (let i=g.enemies.length-1;i>=0;i--) {
    const e=g.enemies[i];
    const ang=Math.atan2(g.ship.y-e.y,g.ship.x-e.x)+Math.sin(g.time/80+e.phase)*0.35;
    e.x+=Math.cos(ang)*e.speed; e.y+=Math.sin(ang)*e.speed;
    if (e.x<-40) e.x=s+40; if (e.x>s+40) e.x=-40;
    if (e.y<-40) e.y=s+40; if (e.y>s+40) e.y=-40;
    if (g.ship.invuln<=0&&dist(g.ship.x,g.ship.y,e.x,e.y)<e.size+10) {
      const dmg=e.contactDmg||1;
      if (g.unlockedSystems.has('shield')&&g.ship.shield>0) {
        g.ship.shield-=dmg*2; spawnParticles(g.ship.x,g.ship.y,'#4488ff',6,false);
        if (g.ship.shield<0) { g.ship.hp+=g.ship.shield; g.ship.shield=0; }
      } else { g.ship.hp-=dmg; }
      g.ship.invuln=38; g.shakeAmt=Math.max(g.shakeAmt,6+dmg*2);
      spawnParticles(g.ship.x,g.ship.y,'#ff3355',10,false);
      if (g.ship.hp<=0) { die(); return; }
    }
  }

  // ── POWERUPS ──
  for (let i=g.powerups.length-1;i>=0;i--) {
    const pu=g.powerups[i]; pu.life--;
    if (pu.life<=0) { g.powerups.splice(i,1); continue; }
    if (dist(g.ship.x,g.ship.y,pu.x,pu.y)<24) {
      if (pu.type==='repair') { g.ship.hp=Math.min(g.ship.maxHp,g.ship.hp+2); spawnParticles(g.ship.x,g.ship.y,'#00ff88',8,false); }
      else if (pu.type==='overcharge') { g.fireCd=0; g.missileCd=0; spawnParticles(g.ship.x,g.ship.y,'#ffb800',8,false); }
      g.powerups.splice(i,1);
    }
  }

  // ── BACKGROUND ANIMATION ──
  for (const neb of g.nebulae) { neb.x+=neb.driftX; neb.y+=neb.driftY; if (neb.x<-200) neb.x=s+200; if (neb.x>s+200) neb.x=-200; if (neb.y<-200) neb.y=s+200; if (neb.y>s+200) neb.y=-200; }
  for (const p of g.planets) { p.x+=p.driftX; p.y+=p.driftY; if (p.x<-100) p.x=s+100; if (p.x>s+100) p.x=-100; if (p.y<-100) p.y=s+100; if (p.y>s+100) p.y=-100; }
  for (const a of g.asteroids) { a.x+=a.vx; a.y+=a.vy; a.rot+=a.rotSpeed; if (a.x<-30) a.x=s+30; if (a.x>s+30) a.x=-30; if (a.y<-30) a.y=s+30; if (a.y>s+30) a.y=-30; }
  // Dust flows opposite to ship movement
  for (const d of g.dust) {
    d.x-=g.ship.vx*0.3; d.y-=g.ship.vy*0.3;
    if (d.x<0) d.x=s; if (d.x>s) d.x=0;
    if (d.y<0) d.y=s; if (d.y>s) d.y=0;
  }

  // ── PARTICLES & DEBRIS ──
  for (let i=g.particles.length-1;i>=0;i--) {
    const p=g.particles[i]; p.x+=p.vx; p.y+=p.vy; p.life--;
    if (p.life<=0) g.particles.splice(i,1);
  }
  for (let i=g.debris.length-1;i>=0;i--) {
    const d=g.debris[i]; d.x+=d.vx; d.y+=d.vy; d.rot+=d.rotSpeed; d.life--;
    d.vx*=0.995; d.vy*=0.995;
    if (d.life<=0||d.x<-50||d.x>s+50||d.y<-50||d.y>s+50) g.debris.splice(i,1);
  }
}

// ─── WEAPONS ────────────────────────────────────────────────
function fireBullet() {
  const a=g.ship.angle;
  g.bullets.push({ x:g.ship.x+Math.cos(a)*18, y:g.ship.y+Math.sin(a)*18, vx:Math.cos(a)*g.upgrades.bulletSpeed, vy:Math.sin(a)*g.upgrades.bulletSpeed, dmg:g.upgrades.bulletDmg, life:65, color:'#00e5ff' });
  // Dual fire with missiles unlocked
  if (g.unlockedSystems.has('missiles')) {
    g.bullets.push({ x:g.ship.x+Math.cos(a-0.2)*16, y:g.ship.y+Math.sin(a-0.2)*16, vx:Math.cos(a)*g.upgrades.bulletSpeed, vy:Math.sin(a)*g.upgrades.bulletSpeed, dmg:g.upgrades.bulletDmg, life:65, color:'#00e5ff' });
    g.bullets.push({ x:g.ship.x+Math.cos(a+0.2)*16, y:g.ship.y+Math.sin(a+0.2)*16, vx:Math.cos(a)*g.upgrades.bulletSpeed, vy:Math.sin(a)*g.upgrades.bulletSpeed, dmg:g.upgrades.bulletDmg, life:65, color:'#00e5ff' });
  }
  // Muzzle flash
  spawnParticles(g.ship.x+Math.cos(a)*20, g.ship.y+Math.sin(a)*20, '#ffffff', 3, false);
  g.shakeAmt=Math.max(g.shakeAmt,0.5);
}

function fireMissile() {
  const a=g.ship.angle;
  const tIdx=g.enemies.length>0?g.enemies.indexOf(g.enemies.reduce((a,b)=>dist(g.ship.x,g.ship.y,a.x,a.y)<dist(g.ship.x,g.ship.y,b.x,b.y)?a:b)):0;
  g.missiles.push({ x:g.ship.x+Math.cos(a)*20, y:g.ship.y+Math.sin(a)*20, vx:Math.cos(a)*g.upgrades.missileSpeed, vy:Math.sin(a)*g.upgrades.missileSpeed, dmg:g.upgrades.missileDmg, speed:g.upgrades.missileSpeed, life:140, targetIdx:tIdx });
  spawnParticles(g.ship.x+Math.cos(a)*20, g.ship.y+Math.sin(a)*20, '#ff8800', 5, false);
}

function firePlasma() {
  const a=g.ship.angle, power=g.plasmaCharge/100;
  g.bullets.push({ x:g.ship.x+Math.cos(a)*22, y:g.ship.y+Math.sin(a)*22, vx:Math.cos(a)*13, vy:Math.sin(a)*13, dmg:Math.floor(g.upgrades.plasmaDmg*power), life:90, color:'#ff6600', size:7+power*9, plasma:true });
  g.shakeAmt=Math.max(g.shakeAmt,14*power);
  spawnParticles(g.ship.x+Math.cos(a)*22, g.ship.y+Math.sin(a)*22, '#ff4400', 18, false);
  spawnParticles(g.ship.x+Math.cos(a)*22, g.ship.y+Math.sin(a)*22, '#ffffff', 6, false);
}

// ─── ENEMIES ────────────────────────────────────────────────
function spawnEnemy() {
  const s=g.arenaSize; let ex,ey;
  const side=Math.floor(Math.random()*4);
  switch(side) { case 0:ex=-40;ey=Math.random()*s;break; case 1:ex=s+40;ey=Math.random()*s;break; case 2:ex=Math.random()*s;ey=-40;break; case 3:ex=Math.random()*s;ey=s+40;break; }
  let type='fighter'; const roll=Math.random();
  if (g.unlockedSystems.has('bosses')&&g.kills>90&&roll<0.07) type='boss';
  else if (g.unlockedSystems.has('squadrons')&&roll<0.22) type='interceptor';
  else if (g.kills>30&&roll<0.18) type='heavy';
  let e={ x:ex,y:ey, type, speed:0, hp:0, maxHp:0, size:10, color:'#ff4466', contactDmg:1, phase:Math.random()*Math.PI*2 };
  switch(type) {
    case 'fighter': e.speed=0.9+g.kills*0.014; e.hp=e.maxHp=1+Math.floor(g.kills/25); e.size=10; e.color='#ff4466'; e.contactDmg=1; break;
    case 'interceptor': e.speed=2.6+g.kills*0.01; e.hp=e.maxHp=2+Math.floor(g.kills/20); e.size=8; e.color='#ff8800'; e.contactDmg=2; break;
    case 'heavy': e.speed=0.65+g.kills*0.005; e.hp=e.maxHp=5+Math.floor(g.kills/14); e.size=17; e.color='#b850ff'; e.contactDmg=3; break;
    case 'boss': e.speed=0.45+g.kills*0.003; e.hp=e.maxHp=18+Math.floor(g.kills/7); e.size=32; e.color='#ff2255'; e.contactDmg=5; break;
  }
  if (g.unlockedSystems.has('squadrons')&&type==='fighter'&&Math.random()<0.35) {
    for (let i=0;i<2;i++) g.enemies.push({...e, x:e.x+(Math.random()-0.5)*70, y:e.y+(Math.random()-0.5)*70, phase:Math.random()*Math.PI*2 });
  }
  g.enemies.push(e);
}

function killEnemy(enemy, idx) {
  g.enemies.splice(idx,1); g.kills++; g.score+=enemy.type==='boss'?500:enemy.type==='heavy'?150:enemy.type==='interceptor'?75:50;
  // Explosion
  spawnParticles(enemy.x,enemy.y,enemy.color,enemy.size*(enemy.type==='boss'?2.5:1.5),false);
  spawnParticles(enemy.x,enemy.y,'#ffffff',Math.floor(enemy.size*0.5),false);
  // Debris
  const dc=enemy.type==='boss'?12:enemy.type==='heavy'?6:3;
  for (let i=0;i<dc;i++) {
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*5;
    g.debris.push({ x:enemy.x,y:enemy.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, rot:Math.random()*Math.PI*2, rotSpeed:(Math.random()-0.5)*0.15, life:30+Math.random()*40, size:1+Math.random()*4, color:enemy.color });
  }
  if (enemy.type==='boss') { g.shakeAmt=Math.max(g.shakeAmt,18); spawnParticles(enemy.x,enemy.y,'#ffffff',25,false); }
  if (g.unlockedSystems.has('shield')&&Math.random()<0.15) {
    g.powerups.push({ x:enemy.x,y:enemy.y, type:Math.random()<0.55?'repair':'overcharge', life:380 });
  }
  checkUnlocks(); if (g.kills>g.bestKills) g.bestKills=g.kills;
  saveGame();
}

function spawnParticles(x,y,color,count,trail) {
  for (let i=0;i<count;i++) {
    const a=Math.random()*Math.PI*2, sp=trail?0.3+Math.random()*1.5:1+Math.random()*5;
    g.particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:trail?8+Math.random()*12:10+Math.random()*28, color, size:trail?0.5+Math.random()*1.5:1+Math.random()*3 });
  }
}

function die() {
  spawnParticles(g.ship.x,g.ship.y,'#ff3355',35,false);
  spawnParticles(g.ship.x,g.ship.y,'#ffffff',18,false);
  for (let i=0;i<15;i++) { const a=Math.random()*Math.PI*2; g.debris.push({ x:g.ship.x,y:g.ship.y, vx:Math.cos(a)*(2+Math.random()*6), vy:Math.sin(a)*(2+Math.random()*6), rot:Math.random()*Math.PI*2, rotSpeed:(Math.random()-0.5)*0.2, life:40+Math.random()*50, size:1+Math.random()*5, color:'#d0d0e0' }); }
  g.shakeAmt=22;
  document.getElementById('death-overlay').className='visible';
  document.getElementById('death-stats').innerHTML=`Ships destroyed: <span class="val">${g.kills}</span><br>Best run: <span class="val">${g.bestKills}</span><br>Systems online: <span class="val">${g.unlockedSystems.size}</span><br>Score: <span class="val">${g.score.toLocaleString()}</span>`;
}

function restartGame() { document.getElementById('death-overlay').className=''; clearSave(); init(null); }

// ═════════════════════════════════════════════════════════════
//  RENDER
// ═════════════════════════════════════════════════════════════
function draw() {
  const s=g.arenaSize;
  ctx.clearRect(0,0,s,s);
  ctx.save();
  ctx.translate(g.shakeX,g.shakeY);

  // ── DEEP SPACE BACKGROUND ──
  const bgGrad=ctx.createRadialGradient(s*0.3,s*0.4,0,s*0.5,s*0.5,s*1.2);
  bgGrad.addColorStop(0,'#05051a'); bgGrad.addColorStop(0.5,'#020212'); bgGrad.addColorStop(1,'#010108');
  ctx.fillStyle=bgGrad; ctx.fillRect(0,0,s,s);

  // ── NEBULAE ──
  for (const neb of g.nebulae) {
    const ng=ctx.createRadialGradient(neb.x,neb.y,0,neb.x,neb.y,neb.r);
    ng.addColorStop(0,neb.c1); ng.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ng; ctx.beginPath(); ctx.arc(neb.x,neb.y,neb.r,0,Math.PI*2); ctx.fill();
  }

  // ── PLANETS ──
  for (const p of g.planets) {
    // Atmosphere glow
    const ag=ctx.createRadialGradient(p.x,p.y,p.r*0.7,p.x,p.y,p.r*1.5);
    ag.addColorStop(0,'rgba(0,0,0,0)'); ag.addColorStop(1,p.atm);
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*1.5,0,Math.PI*2); ctx.fill();
    // Planet body
    const pg=ctx.createRadialGradient(p.x-p.r*0.2,p.y-p.r*0.2,p.r*0.1,p.x,p.y,p.r);
    pg.addColorStop(0,p.color); pg.addColorStop(0.7,'#0a0a14'); pg.addColorStop(1,'#050510');
    ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    // Surface detail
    for (const cr of p.craters) {
      const cx=p.x+Math.cos(cr.angle+p.rotation)*cr.dist*p.r;
      const cy=p.y+Math.sin(cr.angle+p.rotation)*cr.dist*p.r;
      ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(cx,cy,cr.r,0,Math.PI*2); ctx.fill();
    }
    // Ring
    if (p.ring) {
      ctx.strokeStyle=p.ringColor; ctx.lineWidth=12;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r*1.6,p.r*0.35,0.3,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle=p.ringColor; ctx.lineWidth=4;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r*1.35,p.r*0.28,0.3,0,Math.PI*2); ctx.stroke();
    }
  }

  // ── PARALLAX STARS ──
  for (const st of g.stars) {
    // Parallax drift opposite to ship
    const px=st.x-g.ship.vx*st.speed*8; const py=st.y-g.ship.vy*st.speed*8;
    const sx=((px%s)+s)%s; const sy=((py%s)+s)%s;
    st.twinkle+=st.twinkleSpeed;
    const alpha=st.brightness*(0.5+Math.sin(st.twinkle)*0.5);
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.beginPath(); ctx.arc(sx,sy,st.r,0,Math.PI*2); ctx.fill();
    // Bright stars get cross flare
    if (st.r>1.0&&Math.sin(st.twinkle)>0.7) {
      ctx.strokeStyle=`rgba(255,255,255,${alpha*0.3})`; ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.moveTo(sx-st.r*3,sy); ctx.lineTo(sx+st.r*3,sy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx,sy-st.r*3); ctx.lineTo(sx,sy+st.r*3); ctx.stroke();
    }
  }

  // ── ASTEROIDS ──
  for (const a of g.asteroids) {
    ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(a.rot);
    ctx.fillStyle='#1a1a28'; ctx.strokeStyle='#2a2a38'; ctx.lineWidth=0.5;
    ctx.beginPath();
    for (let i=0;i<a.verts.length;i++) {
      const v=a.verts[i];
      if (i===0) ctx.moveTo(v.x,v.y); else ctx.lineTo(v.x,v.y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // ── SPACE DUST ──
  for (const d of g.dust) {
    ctx.fillStyle=`rgba(180,200,255,${d.alpha})`;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill();
  }

  // ── DEBRIS ──
  for (const d of g.debris) {
    ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.rot);
    ctx.globalAlpha=d.life/70;
    ctx.fillStyle=d.color;
    ctx.fillRect(-d.size,-d.size*0.4,d.size*2,d.size*0.8);
    ctx.restore();
  }
  ctx.globalAlpha=1;

  // ── PARTICLES ──
  for (const p of g.particles) {
    const a=p.life/40;
    ctx.fillStyle=p.color; ctx.globalAlpha=Math.min(1,a);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ── POWERUPS ──
  for (const pu of g.powerups) {
    const a=pu.life<60?pu.life/60:1; const col=pu.type==='repair'?'#00ff88':'#ffb800';
    ctx.globalAlpha=a;
    // Outer ring
    ctx.strokeStyle=col; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(pu.x,pu.y,11+Math.sin(g.time/15)*2.5,0,Math.PI*2); ctx.stroke();
    // Core
    ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(pu.x,pu.y,5,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // ── BULLETS ──
  for (const b of g.bullets) {
    ctx.fillStyle=b.color||'#00e5ff';
    ctx.shadowColor=b.color||'#00e5ff'; ctx.shadowBlur=b.plasma?14:6;
    ctx.beginPath();
    if (b.plasma) {
      // Glowing plasma ball with inner core
      const gr=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.size||8);
      gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.3,'#ffaa00'); gr.addColorStop(1,'rgba(255,100,0,0)');
      ctx.fillStyle=gr; ctx.arc(b.x,b.y,b.size||8,0,Math.PI*2); ctx.fill();
    } else {
      // Bullet trail
      ctx.fillStyle=b.color; ctx.beginPath();
      ctx.moveTo(b.x+Math.cos(Math.atan2(b.vy,b.vx))*5,b.y+Math.sin(Math.atan2(b.vy,b.vx))*5);
      ctx.lineTo(b.x-Math.cos(Math.atan2(b.vy,b.vx))*3,b.y-Math.sin(Math.atan2(b.vy,b.vx))*3+2);
      ctx.lineTo(b.x-Math.cos(Math.atan2(b.vy,b.vx))*3,b.y-Math.sin(Math.atan2(b.vy,b.vx))*3-2);
      ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur=0;
  }

  // ── MISSILES ──
  for (const m of g.missiles) {
    ctx.save(); ctx.translate(m.x,m.y);
    const a=Math.atan2(m.vy,m.vx); ctx.rotate(a);
    ctx.fillStyle='#ff6622'; ctx.shadowColor='#ff8800'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-5,-4); ctx.lineTo(-3,0); ctx.lineTo(-5,4); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0; ctx.restore();
  }

  // ── ENEMIES ──
  for (const e of g.enemies) {
    ctx.save(); ctx.translate(e.x,e.y);
    const a=Math.atan2(g.ship.y-e.y,g.ship.x-e.x); ctx.rotate(a+Math.PI/2);
    ctx.fillStyle=e.color; ctx.shadowColor=e.color; ctx.shadowBlur=e.type==='boss'?20:8;
    ctx.beginPath();
    if (e.type==='boss') {
      // Capital ship
      ctx.moveTo(0,-e.size); ctx.lineTo(e.size*0.8,e.size*0.3);
      ctx.lineTo(e.size*0.5,e.size*0.5); ctx.lineTo(e.size*0.5,e.size*0.9);
      ctx.lineTo(-e.size*0.5,e.size*0.9); ctx.lineTo(-e.size*0.5,e.size*0.5);
      ctx.lineTo(-e.size*0.8,e.size*0.3);
    } else if (e.type==='heavy') {
      ctx.moveTo(0,-e.size); ctx.lineTo(e.size*0.7,e.size*0.5);
      ctx.lineTo(e.size*0.4,e.size*0.3); ctx.lineTo(0,e.size*0.6);
      ctx.lineTo(-e.size*0.4,e.size*0.3); ctx.lineTo(-e.size*0.7,e.size*0.5);
    } else if (e.type==='interceptor') {
      ctx.moveTo(0,-e.size); ctx.lineTo(e.size*0.6,e.size*0.8);
      ctx.lineTo(0,e.size*0.2); ctx.lineTo(-e.size*0.6,e.size*0.8);
    } else {
      ctx.moveTo(0,-e.size); ctx.lineTo(e.size*0.8,e.size*0.7);
      ctx.lineTo(0,e.size*0.2); ctx.lineTo(-e.size*0.8,e.size*0.7);
    }
    ctx.closePath(); ctx.fill();
    // Cockpit/eye
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(0,e.size*0.1,Math.max(2,e.size*0.15),0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // HP bar
    if ((e.type==='heavy'||e.type==='boss')&&e.maxHp>3) {
      const bw=e.size*2, bh=3;
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(-bw/2,-e.size-14,bw,bh);
      const hpR=e.hp/e.maxHp;
      const hpc=hpR>0.5?e.color:'#ff3355';
      ctx.fillStyle=hpc; ctx.fillRect(-bw/2,-e.size-14,bw*hpR,bh);
    }
    ctx.restore();
  }

  // ── DRONE ──
  if (g.unlockedSystems.has('drone')) {
    const da=g.ship.angle+1.5+Math.sin(g.time/40)*0.3;
    const dx=g.ship.x+Math.cos(da)*32, dy=g.ship.y+Math.sin(da)*32;
    ctx.fillStyle='#b850ff'; ctx.shadowColor='#b850ff'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(dx,dy,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(dx,dy,2.5,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // Tether line
    ctx.strokeStyle='rgba(184,80,255,0.12)'; ctx.lineWidth=0.5;
    ctx.setLineDash([2,5]); ctx.beginPath(); ctx.moveTo(g.ship.x,g.ship.y); ctx.lineTo(dx,dy); ctx.stroke(); ctx.setLineDash([]);
  }

  // ── PLAYER SHIP ──
  const invAlpha=g.ship.invuln>0?0.3+Math.sin(g.time/6)*0.35:1;
  ctx.globalAlpha=invAlpha;
  ctx.save(); ctx.translate(g.ship.x,g.ship.y); ctx.rotate(g.ship.angle);

  // Engine glow (behind ship)
  if (g.ship.thrusting) {
    const glowSize=g.ship.boosting?22:12;
    const glowColor=g.ship.boosting?'#00e5ff':'#3366aa';
    const glow=ctx.createRadialGradient(-12,0,0,-12,0,glowSize);
    glow.addColorStop(0,'rgba(255,255,255,0.9)'); glow.addColorStop(0.2,glowColor); glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(-12,0,glowSize,0,Math.PI*2); ctx.fill();
  }

  // Shield
  if (g.unlockedSystems.has('shield')&&g.ship.shield>3) {
    const sa=g.ship.shield/g.upgrades.shieldMax;
    const sg=ctx.createRadialGradient(0,0,20,0,0,26);
    sg.addColorStop(0,'rgba(68,136,255,0)'); sg.addColorStop(0.7,`rgba(68,136,255,${0.1+sa*0.2})`); sg.addColorStop(1,`rgba(68,136,255,${0.05+sa*0.3})`);
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=`rgba(68,136,255,${0.3+sa*0.4})`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2); ctx.stroke();
  }

  // Plasma charge ring
  if (g.plasmaCharging&&g.plasmaCharge>0) {
    const cr=14+g.plasmaCharge*0.35;
    ctx.strokeStyle=`rgba(255,136,0,${g.plasmaCharge/100})`; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(0,0,cr,0,Math.PI*2*(g.plasmaCharge/100)); ctx.stroke();
  }

  // Main hull
  const hullGrad=ctx.createLinearGradient(20,0,-12,0);
  hullGrad.addColorStop(0,'#e8e8f0'); hullGrad.addColorStop(0.5,'#b0b8c8'); hullGrad.addColorStop(1,'#606878');
  ctx.fillStyle=hullGrad;
  ctx.beginPath();
  ctx.moveTo(18,0);
  ctx.bezierCurveTo(18,-9,4,-12,-10,-10);
  ctx.lineTo(-6,0);
  ctx.lineTo(-10,10);
  ctx.bezierCurveTo(4,12,18,9,18,0);
  ctx.closePath(); ctx.fill();

  // Hull panel lines
  ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(10,-5); ctx.lineTo(-4,-6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10,5); ctx.lineTo(-4,6); ctx.stroke();

  // Cockpit
  const cpGrad=ctx.createLinearGradient(15,0,2,0);
  cpGrad.addColorStop(0,'#00e5ff'); cpGrad.addColorStop(0.5,'#00b8d4'); cpGrad.addColorStop(1,'#004466');
  ctx.fillStyle=cpGrad;
  ctx.beginPath(); ctx.ellipse(7,0,7,4.5,0,0,Math.PI*2); ctx.fill();
  // Cockpit glass reflection
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.ellipse(7,-1.5,3.5,1.8,0,0,Math.PI*2); ctx.fill();

  // Wing accents
  if (g.unlockedSystems.has('missiles')) {
    ctx.fillStyle='#b850ff'; ctx.shadowColor='#b850ff'; ctx.shadowBlur=4;
    ctx.fillRect(-5,-8,4,3); ctx.fillRect(-5,5,4,3);
    ctx.shadowBlur=0;
    // Missile pod
    ctx.fillStyle='#444'; ctx.fillRect(-3,-9,2,2); ctx.fillRect(-3,7,2,2);
  }
  if (g.unlockedSystems.has('plasma')) {
    ctx.fillStyle='#ff8800'; ctx.shadowColor='#ff8800'; ctx.shadowBlur=3;
    ctx.beginPath(); ctx.arc(0,-6,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0,6,3,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  ctx.restore();
  ctx.globalAlpha=1;

  // ── CROSSHAIR (at mouse) ──
  if (g.unlockedSystems.has('reticle')) {
    const rx=g.mouse.x, ry=g.mouse.y;
    ctx.strokeStyle='rgba(0,229,255,0.5)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(rx,ry,9,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx-13,ry); ctx.lineTo(rx-5,ry); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx+5,ry); ctx.lineTo(rx+13,ry); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx,ry-13); ctx.lineTo(rx,ry-5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx,ry+5); ctx.lineTo(rx,ry+13); ctx.stroke();
  }

  ctx.restore();

  // ─── VIGNETTE ───
  const vg=ctx.createRadialGradient(s/2,s/2,s*0.55,s/2,s/2,s*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,s,s);

  // ─── HUD ──────────────────────────────────────────────────
  // Kill counter
  ctx.fillStyle='#c0c8d8'; ctx.font='bold 10px "Courier New"'; ctx.textAlign='left';
  ctx.fillText(`DESTROYED ${g.kills}`,14,20);

  // Spawn protection indicator
  if (g.ship.invuln>120) {
    const alpha=0.5+Math.sin(g.time/8)*0.5;
    ctx.fillStyle=`rgba(0,229,255,${alpha})`; ctx.font='bold 12px "Courier New"';
    ctx.fillText('🛡️ LAUNCH PROTECTION',14,36);
  }

  // Shield bar
  if (g.unlockedSystems.has('shieldHud')) {
    const bx=14,by=28,bw=110,bh=5;
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx,by,bw,bh);
    const sf=g.ship.shield/g.upgrades.shieldMax;
    const sg=ctx.createLinearGradient(bx,0,bx+bw*sf,0);
    sg.addColorStop(0,'#2266cc'); sg.addColorStop(1,'#4488ff');
    ctx.fillStyle=sg; ctx.fillRect(bx,by,bw*sf,bh);
    ctx.strokeStyle='rgba(68,136,255,0.4)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle='#8899bb'; ctx.font='7px "Courier New"'; ctx.fillText(`SHIELD ${Math.floor(g.ship.shield)}`,bx,by+bh+8);
  }

  // HP bar
  const hby=g.unlockedSystems.has('shieldHud')?48:28;
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(14,hby,110,5);
  const hpR=g.ship.hp/g.ship.maxHp;
  const hc=hpR>0.5?'#00ff88':hpR>0.25?'#ffb800':'#ff3355';
  ctx.fillStyle=hc; ctx.fillRect(14,hby,110*hpR,5);
  ctx.strokeStyle=`rgba(${hc==='#00ff88'?'0,255,136':hc==='#ffb800'?'255,184,0':'255,51,85'},0.4)`; ctx.lineWidth=1; ctx.strokeRect(14,hby,110,5);
  ctx.fillStyle='#8899bb'; ctx.font='7px "Courier New"'; ctx.fillText(`HULL ${g.ship.hp}/${g.ship.maxHp}`,14,hby+13);

  // Boost fuel
  if (g.unlockedSystems.has('boostHud')) {
    const by=g.unlockedSystems.has('shieldHud')?72:52;
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(14,by,90,3);
    ctx.fillStyle='#00e5ff'; ctx.fillRect(14,by,90*(g.ship.boostFuel/100),3);
    ctx.fillStyle='#667788'; ctx.font='7px "Courier New"'; ctx.fillText(`BOOST ${Math.floor(g.ship.boostFuel)}%`,14,by+10);
  }

  // Phase
  if (g.unlockedSystems.has('phaseHud')) {
    const by=g.unlockedSystems.has('boostHud')?92:g.unlockedSystems.has('shieldHud')?72:52;
    const cd=g.ship.teleportCooldown;
    ctx.fillStyle=cd>0?'#555':'#b850ff'; ctx.font='bold 9px "Courier New"';
    ctx.fillText(cd>0?`PHASE ${Math.ceil(cd/60)}s`:'PHASE READY',14,by);
  }

  // Right side HUD
  ctx.textAlign='right';
  ctx.fillStyle='#ffb800'; ctx.font='bold 10px "Courier New"';
  ctx.fillText(`SCORE ${g.score.toLocaleString()}`,s-14,20);
  ctx.fillStyle='#667788'; ctx.font='8px "Courier New"';
  ctx.fillText(`BEST ${g.bestKills} KILLS`,s-14,34);

  // Missile status
  if (g.unlockedSystems.has('missileHud')) {
    ctx.fillStyle=g.missileCd>0?'#664400':'#ff8800'; ctx.font='8px "Courier New"';
    ctx.fillText(g.missileCd>0?`MISSILE ${Math.ceil(g.missileCd/60)}s`:'MISSILE READY',s-14,48);
  }

  // Next unlock
  const next=UNLOCKS.find(u=>u.at>g.kills);
  if (next) {
    ctx.fillStyle='#334'; ctx.font='8px "Courier New"';
    ctx.fillText(`${next.name} @ ${next.at}`,s-14,s-14);
  }

  // Center: ship class
  ctx.textAlign='center';
  let cls='VOID HUNTER';
  if (g.unlockedSystems.has('infinite')) cls='⬡ SINGULARITY';
  else if (g.unlockedSystems.has('drone')) cls='⬡ WARLORD';
  else if (g.unlockedSystems.has('teleport')) cls='⬡ PHANTOM';
  else if (g.unlockedSystems.has('plasma')) cls='⬡ DESTROYER';
  else if (g.unlockedSystems.has('boost')) cls='⬡ STRIKER';
  else if (g.unlockedSystems.has('missiles')) cls='⬡ GUNSHIP';
  ctx.fillStyle='rgba(192,200,216,0.5)'; ctx.font='bold 9px "Courier New"';
  ctx.fillText(cls,s/2,20);

  // ── MINIMAP RADAR ──
  const mr=55, mx=s-mr-16, my=s-mr-16;
  // Background
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,229,255,0.3)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.stroke();
  // Crosshairs
  ctx.strokeStyle='rgba(0,229,255,0.15)'; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.moveTo(mx-mr,my); ctx.lineTo(mx+mr,my); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx,my-mr); ctx.lineTo(mx,my+mr); ctx.stroke();
  // Compass ticks
  for (let i=0;i<8;i++) {
    const a=(Math.PI/4)*i, tx=mx+Math.cos(a)*(mr-4), ty=my+Math.sin(a)*(mr-4);
    ctx.fillStyle='rgba(0,229,255,0.3)'; ctx.fillRect(tx-1,ty-1,2,2);
  }
  // Sweep line
  const sweepAngle=(g.time*0.04)%(Math.PI*2);
  ctx.strokeStyle='rgba(0,229,255,0.2)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(mx+Math.cos(sweepAngle)*mr,my+Math.sin(sweepAngle)*mr); ctx.stroke();
  // Player dot
  ctx.fillStyle='#00e5ff'; ctx.shadowColor='#00e5ff'; ctx.shadowBlur=4;
  ctx.beginPath(); ctx.arc(mx,my,3,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  // Enemy dots
  const scale=mr/g.arenaSize;
  for (const e of g.enemies) {
    const rx=mx+(e.x-g.ship.x)*scale, ry=my+(e.y-g.ship.y)*scale;
    const ddx=rx-mx, ddy=ry-my;
    if (Math.sqrt(ddx*ddx+ddy*ddy)<mr-2) {
      ctx.fillStyle=e.color; ctx.beginPath(); ctx.arc(rx,ry,1.5,0,Math.PI*2); ctx.fill();
    }
  }
  // Powerup dots
  for (const pu of g.powerups) {
    const rx=mx+(pu.x-g.ship.x)*scale, ry=my+(pu.y-g.ship.y)*scale;
    const ddx=rx-mx, ddy=ry-my;
    if (Math.sqrt(ddx*ddx+ddy*ddy)<mr-2) {
      ctx.fillStyle=pu.type==='repair'?'#00ff88':'#ffb800'; ctx.beginPath(); ctx.arc(rx,ry,1.2,0,Math.PI*2); ctx.fill();
    }
  }
  // Label
  ctx.fillStyle='rgba(0,229,255,0.4)'; ctx.font='7px "Courier New"'; ctx.textAlign='center';
  ctx.fillText('RADAR',mx,my-mr-4);
}

function gameLoop() {
  update(); draw();
  requestAnimationFrame(gameLoop);
}

// ─── UTILS ──────────────────────────────────────────────────
function dist(x1,y1,x2,y2) { return Math.sqrt((x2-x1)**2+(y2-y1)**2); }

// ─── START ──────────────────────────────────────────────────
const saved=loadSave(); init(saved||null); gameLoop();

console.log('%c🚀 VOID HUNTER %c— The Game That Builds Itself','color:#00e5ff;font-size:16px;','');
console.log('%cW/UP=thrust | A/D=turn | SPACE/Click=fire | SHIFT=boost | E/Right-click=missile','color:#888;');
</script>
</body>
