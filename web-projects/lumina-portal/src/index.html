<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMINA | Luxury Client Portal</title>
  <meta name="description" content="Private photography gallery and proofing system">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { serif: ['Cormorant Garamond', 'serif'], sans: ['Inter', 'sans-serif'] },
          colors: { gold: { 400: '#d4af37', 500: '#c5a028', 600: '#b8941f' }, dark: { 900: '#0a0a0a', 800: '#1a1a1a', 700: '#2a2a2a' } }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="antialiased selection:bg-gold-400 selection:text-black">
  <div class="grain"></div>

  <main class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <div class="absolute inset-0" id="bg-slideshow">
      <div class="slide active">
        <img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=1920&q=80" class="w-full h-full object-cover opacity-30" alt="">
      </div>
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=1920&q=80" class="w-full h-full object-cover opacity-30" alt="">
      </div>
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=1920&q=80" class="w-full h-full object-cover opacity-30" alt="">
      </div>
    </div>
    <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/80 to-black"></div>

    <div class="relative z-10 w-full max-w-md px-6 text-center">
      <h1 class="font-serif text-6xl md:text-7xl font-light tracking-tight mb-4">LUMINA</h1>
      <p class="text-gray-400 text-sm tracking-[0.3em] uppercase mb-12">Client Portal</p>
      <a href="/.netlify/functions/auth-guest" class="inline-block w-full max-w-xs mx-auto bg-white text-black py-4 px-8 font-medium tracking-wider uppercase text-sm transition-all hover:bg-gold-400 text-center">
        Enter
      </a>
    </div>
  </main>

  <script>
    let currentBg = 0;
    const bgSlides = document.querySelectorAll('#bg-slideshow .slide');
    if (bgSlides.length) {
      setInterval(() => {
        bgSlides[currentBg].classList.remove('active');
        currentBg = (currentBg + 1) % bgSlides.length;
        bgSlides[currentBg].classList.add('active');
      }, 6000);
    }
    (function checkSession() {
      fetch('/api/session-check', { credentials: 'include' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (data && data.galleryId) {
            window.location.href = '/gallery/' + encodeURIComponent(data.galleryId);
          }
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
