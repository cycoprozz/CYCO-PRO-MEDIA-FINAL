backend:
  name: git-gateway
  branch: main

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: "galleries"
    label: "Galleries"
    folder: "content/galleries"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Wedding", "Portrait", "Corporate", "Event"] }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Cover Image", name: "cover", widget: "image" }
      - { label: "Expiry Date", name: "expiresAt", widget: "datetime" }
      - label: "Images"
        name: "images"
        widget: "list"
        fields:
          - { label: "Image", name: "url", widget: "image" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Metadata", name: "meta", widget: "string" }
      - label: "Client Emails"
        name: "clients"
        widget: "list"
        field: { label: "Email", name: "email", widget: "string" }
